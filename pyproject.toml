[project]
name = "twp"
version = "4.0.0"
description = "Open-source toolbox for quantitative trading strategy development"
readme = "README.md"
authors = [{ name = "Jev Kuznetsov", email = "jev.kuznetsov@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
    "yfinance>=0.2.40",
    "plotly>=5.18",
]

[project.optional-dependencies]
fred = ["fredapi>=0.5.2"]

[build-system]
requires = ["uv_build>=0.8.8,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "invoke>=2.2.0",
    "mypy>=1.17.1",
    "pytest>=8.4.1",
    "pytest-cov>=6.1.0",
    "ruff>=0.12.8",
]

[tool.ruff.lint]
extend-select = ["B", "I", "C4", "SIM", "PLE", "RUF"]
ignore = ["D100", "D101", "D102", "D103"]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
